# Great Docs Configuration
# See https://posit-dev.github.io/great-docs/user-guide/configuration.html

parser: numpy
dynamic: true

display_name: callgrove
repo: https://github.com/mjfrigaard/callgrove
site_url: https://mjfrigaard.github.io/callgrove/
pypi: false

authors:
  - name: Martin Frigaard
    role: Author
    email: mjfrigaard@pm.me

skill:
  enabled: false

changelog:
  enabled: false

reference:
  - title: Call trees
    desc: Build the call tree of a function, a folder of source files, or a Shiny app.
    contents:
      - call_stack
      - call_tree_dir
      - call_tree_app
  - title: Tree object
    desc: The node every builder returns, and how it prints.
    contents:
      - CallTree

# Docs Theme
# ----------
# 70s palette from stackcallr's pkgdown theme; fonts and the rest are in
# docs-theme.css
accent_color:
  light: "#2A6F77"
  dark: "#E8A33D"
navbar_color:
  light: "#F9F3E1"
  dark: "#3E2A1E"
site:
  css: docs-theme.css

# Let mermaid figures use the full column width (the centered flex wrapper
# otherwise shrinks each diagram to 300px), and keep <code> labels readable.
# The script marks each diagram as already fixed, so great-docs' dark mode
# script leaves the palette colors alone (docs-theme.css keeps them light).
include_in_header:
  - '<script>new MutationObserver(function () { document.querySelectorAll("svg.mermaid-js").forEach(function (s) { s.dataset.gdFixed = "true"; }); }).observe(document.documentElement, { childList: true, subtree: true });</script>'
  - '<style>.cell-output-display:has(.mermaid-js) > div { width: 100%; } svg.mermaid-js code { background: transparent !important; color: inherit !important; padding: 0; font-size: inherit; font-family: inherit; }</style>'
